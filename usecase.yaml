schema_version: 1
slug: prompt
name: Prompt Portfolio
tagline: Manage a prompt portfolio. Compare a change. Hear it live.
vertical: Financial Services
langfuse_features:
- prompt-management
- experiments
- evaluators
- datasets
- sessions
- user-feedback
- tracing
story: Explore nine managed prompt families and their history, compare a staging candidate with the same
  evaluation rubrics, then let an authorised presenter promote it. Three instrumented chatbots fetch the
  production prompt on every turn and link to the Langfuse session. Shared text building blocks keep
  common instructions reusable across the portfolio.
target:
  project_hint: demo
  supports:
  - cloud_eu
  - cloud_us
  - self_hosted
base_config:
  default: config/demo.yaml
config_schema:
  type: object
  properties:
    generation.seed:
      type: integer
      default: 42
      minimum: 0
      title: Generation seed
      description: Determines reproducible trace IDs and data. Re-seeding an uncleared project appends duplicate observations.
    generation.target_traces:
      type: integer
      minimum: 1
      maximum: 6000
      default: 1620
      title: Target traces
      description: Production traces across 28 local calendar days, including the as-of date. Presentation uses 1620; Quick rehearsal uses 270. Nine prompt families, nine datasets and 18 historical experiment traces remain fixed. Very small Custom runs may omit production families.
    evaluation.provider:
      type: string
      default: anthropic
      title: Judge provider connection
      minLength: 1
      description: Langfuse model connection name, not an API key. Evaluator setup validates the connection and may create it from the configured provider credential.
    evaluation.model:
      type: string
      default: claude-sonnet-5-5
      title: Judge model
      minLength: 1
      description: Provider model ID validated by evaluator setup. Historical seed generation makes no model calls.
  required: []
setup:
  version: 1
  schedule:
    timezone: Europe/Berlin
    end: inclusive
    history:
      fixed_days: 28
  fields:
    generation.target_traces:
      group: volume
    generation.seed:
      group: advanced
    evaluation.provider:
      group: advanced
    evaluation.model:
      group: advanced
  presets:
    quick_rehearsal:
      label: Quick rehearsal
      values:
        generation.target_traces: 270
pipeline:
- id: probe
  run: synth probe --config {config}
  timeout_minutes: 5
  fatal: true
- id: plan
  gate: confirm
  run: synth plan --config {config}
  parse:
    event_count: 'regex:total_traces: (\d+)'
    plan_counts: 'regex:PLAN_COUNTS=(\{[^\n]+\})'
  timeout_minutes: 5
  fatal: true
- id: configure-evaluators
  run: synth configure-evaluators --config {config}
  requires_secrets:
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_SECRET_KEY
  - LLM_API_KEY
  timeout_minutes: 15
  fatal: true
- id: seed
  run: synth seed --config {config}
  timeout_minutes: 90
  fatal: true
- id: configure-experiments
  run: synth configure-evaluators --config {config} --update-mappings
  timeout_minutes: 30
  fatal: true
- id: verify
  run: synth verify --config {config}
  fatal: true
artifacts:
- path: SCHEDULE.json
  render: json
  title: Generated schedule
- path: DEMO_SCRIPT.md
  render: markdown
  title: Presenter Runbook
assets:
  docs:
  - path: README.md
    title: Overview
llm:
  providers:
  - anthropic
live_components:
- name: companion
  description: Three live chatbots using the managed production prompts. Product explainer uses Claude Sonnet
    5.5; fee explainer and application guide use Claude Opus 5.5. Exact prompt versions, both evaluation
    subjects, user feedback and a primary Open session action.
  command: synth companion --config {config} --host 0.0.0.0 --port 8080
  port: 8080
  requires_secrets:
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_SECRET_KEY
  - LLM_API_KEY
  routes:
  - path: /
    title: Prompt Portfolio — live chat
  health_path: /healthz

teardown:
  note: >-
    Langfuse ingestion is append-only. Depot teardown stops companion instances and
    releases portal resources; it does not delete Langfuse data. Use a fresh demo
    project for another seed, or explicitly clear the previous project in Langfuse
    before deploying again. Never retry a partial seed against an uncleared project.
